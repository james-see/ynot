[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ynot"
version = "0.7.0"
description = "A simple YouTube downloader GUI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "James Campbell", email = "james@jamescampbell.us" }]
maintainers = [{ name = "James Campbell", email = "james@jamescampbell.us" }]
keywords = ["youtube", "yt-dlp", "downloader", "gui", "transcript"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",

    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "certifi",
    "youtube-transcript-api",
    "yt-dlp",
]

[project.urls]
Homepage = "https://github.com/james-see/ynot"
Repository = "https://github.com/james-see/ynot"
Issues = "https://github.com/james-see/ynot/issues"

[project.scripts]
ynot = "main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools]
py-modules = ["main"]

[tool.coverage.run]
branch = true
source = ["main"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "E402", "N806", "N802"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-q"
